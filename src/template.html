<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do</title>
</head>
<body>
  <main>
    <div class="project-container">
        <h1>My Projects</h1>
         <button class="add-project"><span class="add-style">+</span> New Project</button>
         <div class="projects">
         </div>

         <div class="project-form">
            <form>
                <input type="text" class="project-name" placeholder="Project name">

                <div class="form-buttons">
                    <button type="submit">Create</button>
                    <button type="button" class="close-project-form">Close</button>
                </div>
            </form>
        </div>
   
        </div>
        
    <div class="task-container">
        <h1>Tasks:</h1>
     
        <button class="add-task"><span class="add-style">+</span> New Task</button>
        <div class="tasks">
        </div>
        <div class="task-form">
            <form>
                    <input
                        type="text"
                        class="task-title"
                        placeholder="Task title"
                        required
                    >

                    <textarea
                        class="task-description"
                        placeholder="Description"
                        rows="4"
                    ></textarea>

                    <input
                        type="date"
                        class="task-due-date"
                        required
                    >

                    <select class="task-priority" required>
                        <option value="" disabled selected>Priority</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>

                    <div class="form-buttons">
                        <button type="submit">Create</button>
                        <button type="button" class="close-task-form">Close</button>
                    </div>
                </form>
    </div>
    </div>
  </main> 
</body>
</html>
